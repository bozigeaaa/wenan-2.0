<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分镜脚本</title>
<style>
:root{color-scheme:light;--ink:#162c37;--muted:#60727d;--line:#dce5e8;--teal:#086c68;--soft:#eaf5f2}*{box-sizing:border-box}body{margin:0;background:#f3f6f6;color:var(--ink);font:15px/1.8 'Microsoft YaHei','PingFang SC',sans-serif}main{max-width:1900px;margin:auto;padding:34px 38px 26px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--teal);font-weight:700}h1{margin:8px 0 12px;font-size:28px;line-height:1.45;font-weight:650;letter-spacing:.2px}.meta{display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);font-size:13px}.meta b{font-family:Consolas,monospace;font-size:15px;color:var(--ink);font-weight:500}details{margin:18px 0;color:var(--muted);font-size:13px;max-width:1040px}summary{cursor:pointer;width:fit-content;color:var(--teal)}details p{margin:6px 0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:20px 0 12px;flex-wrap:wrap}.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:4px;background:#e4ecec;border-radius:10px}button{border:0;background:transparent;color:#4f626b;padding:9px 18px;font:500 14px/1.5 'Microsoft YaHei',sans-serif;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:white;color:var(--teal);box-shadow:0 1px 4px #162c3712}button:focus-visible,summary:focus-visible{outline:3px solid #0a817c;outline-offset:3px}.hint{font-size:12px;color:var(--muted)}.table-wrap{background:white;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 292px);min-height:360px;box-shadow:0 6px 28px #263d4306;scrollbar-color:#a6bdbb #edf3f3;scrollbar-width:thin}table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%;min-width:1160px}th,td{padding:21px 22px;border-bottom:1px solid var(--line);border-right:1px solid #e7eded;vertical-align:top;overflow-wrap:anywhere}th{position:sticky;top:0;z-index:4;background:#193b46;color:#fff;text-align:left;font-size:13px;font-weight:500;padding:15px 22px;white-space:nowrap;letter-spacing:.5px}tbody tr:nth-child(even){background:#f6f9f9}tbody tr:hover{background:#eef6f3}td:last-child,th:last-child{border-right:0}tr:last-child td{border-bottom:0}.index{width:64px;text-align:center;padding-left:12px;padding-right:12px}.index span{display:inline-block;font:600 16px/1.5 Consolas,monospace;color:var(--teal);border-bottom:2px solid #c8dfd8;padding-bottom:3px}.time{width:186px;white-space:nowrap;font:13px/1.8 Consolas,monospace;color:#526b75;overflow-wrap:normal}.subtitle{font-size:16px;color:#172d36;font-weight:500;line-height:1.95}.subtitle.en{font-family:'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:400;line-height:1.85}.subtitle.ar{font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:18px;font-weight:400;line-height:1.95;direction:rtl;text-align:right;unicode-bidi:isolate}.scene{font-size:14px;color:#415c69;line-height:1.9}.visual{font-size:14px;line-height:1.95}.visual strong{font-weight:600;color:var(--teal)}.stack-line{display:block;margin-bottom:10px}.stack-line:last-child{margin-bottom:0}footer{display:flex;justify-content:space-between;gap:15px;padding:13px 2px 0;color:var(--muted);font-size:12px}body.all table{width:2024px;min-width:2024px}.index,.time{position:sticky;left:0;z-index:2;background:inherit}.time{left:64px}.index:before,.time:before{content:'';position:absolute;inset:0;z-index:-1;background:#fff}tr:nth-child(even) .index:before,tr:nth-child(even) .time:before{background:#f6f9f9}tr:hover .index:before,tr:hover .time:before{background:#eef6f3}th.index,th.time{z-index:6;background:#193b46;color:white;font-family:inherit}th.index:before,th.time:before{display:none}@media(max-width:800px){main{padding:22px 16px}h1{font-size:23px}.meta{gap:12px}.toolbar{gap:10px}.table-wrap{max-height:68vh}button{padding:9px 13px}footer{flex-direction:column;gap:4px}}
@media print{@page{size:A3 landscape;margin:12mm}body{background:#fff}main{padding:0}.toolbar{display:none}.table-wrap{max-height:none;overflow:visible;border:0;box-shadow:none;min-height:0}table,body.all table{width:100%;min-width:0}th,td{padding:10px 12px;font-size:10pt!important}th{position:static}thead{display:table-header-group}tr{break-inside:avoid}.index,.time{position:static}.index:before,.time:before{display:none}th{print-color-adjust:exact;-webkit-print-color-adjust:exact}h1{font-size:20pt}.subtitle.ar{font-size:11pt!important}footer{font-size:9pt}.hint{display:none}}

.material-pick{margin:0 0 15px;padding:11px 13px;background:#eaf5f2;border:1px solid #c9e2db;border-left:3px solid #18847a;border-radius:7px;line-height:1.6}.material-heading{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;font-weight:600;color:#37645d}.material-example{font-size:10px;font-weight:400;border:1px solid #c4d9d3;border-radius:4px;padding:0 5px;color:#61756f;background:#fff}.material-codes{display:flex;gap:7px;flex-wrap:wrap}.material-code{font:700 14px/1.5 Consolas,monospace;color:#075e57;background:#fff;border:1px solid #b9d9cf;border-radius:5px;padding:3px 9px}.material-pending{font-size:12px;color:#73857e}.material-note{font-size:12px;color:#60756e;margin:12px 0 0}.material-pick.pending{background:#f3f7f6;border-color:#dee8e4;border-left-color:#bacdc5}
</style></head><body><main>
<header><div class="eyebrow" id="brand"></div><h1 id="title"></h1><div class="meta"><span><b id="shot-count"></b> 个镜头</span><span>预计时长 <b id="duration"></b></span><span>中文原声 · 中英阿字幕</span></div></header>
<details><summary>制作说明与估时口径</summary><div id="notes"></div></details>
<div class="toolbar"><div class="tabs" role="group" aria-label="字幕审阅视图"><button type="button" data-view="zh" aria-pressed="true">中文审稿</button><button type="button" data-view="en" aria-pressed="false">English</button><button type="button" data-view="ar" aria-pressed="false">العربية</button><button type="button" data-view="all" aria-pressed="false">完整七列</button></div><span class="hint" id="view-hint">中文口播与剪辑建议并排审阅</span></div>
<div class="table-wrap" role="region" aria-label="分镜表，可横向和纵向滚动" tabindex="0"><table aria-label="轻钢宿舍分镜脚本"><colgroup id="columns"></colgroup><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div>
<footer><span id="count" aria-live="polite">字幕、翻译与时间码保持原稿</span><span>素材示意与实际项目画面须区分</span></footer>
</main><script id="storyboard-data" type="application/json">__STORYBOARD_JSON__</script><script>
const doc=JSON.parse(document.getElementById('storyboard-data').textContent);const data=doc.rows;const clean=data.map(r=>r.slice());const headers=['镜号','时间码','中文字幕','英文字幕','阿拉伯语字幕','分镜','画面／素材建议'];const classes=['index','time','subtitle zh','subtitle en','subtitle ar','scene','visual'];
document.title=doc.title+' · 分镜脚本';document.getElementById('title').textContent=doc.title;document.getElementById('brand').textContent=doc.brand||'分镜脚本';document.getElementById('shot-count').textContent=data.length;document.getElementById('duration').textContent=doc.duration||data.at(-1)[1].split(/[–—]/).at(-1);document.getElementById('count').textContent=data.length+' 镜 · 字幕、翻译与时间码保持原稿';for(const t of doc.notes||[]){const p=document.createElement('p');p.textContent=t;document.getElementById('notes').append(p)}if(!doc.notes?.length)document.querySelector('details').hidden=true;
function materialPick(shot){const pick=doc.materials?.[shot];const codes=pick?.codes||[];const box=document.createElement('div');box.className='material-pick'+(codes.length?'':' pending');const heading=document.createElement('div');heading.className='material-heading';heading.textContent='推荐素材';box.append(heading);if(codes.length){if(pick.example){const flag=document.createElement('span');flag.className='material-example';flag.textContent='示例编号';heading.append(flag)}const line=document.createElement('div');line.className='material-codes';codes.forEach(code=>{const tag=document.createElement('span');tag.className='material-code';tag.textContent=code;line.append(tag)});box.append(line)}else{const empty=document.createElement('div');empty.className='material-pending';empty.textContent=pick?.status||'待关联素材';box.append(empty)}if(pick?.usage){const usage=document.createElement('div');usage.className='material-pending';usage.textContent=pick.usage;box.append(usage)}return box}
function render(view){const ids=view==='all'?[0,1,2,3,4,5,6]:[0,1,{zh:2,en:3,ar:4}[view],5,6];document.body.classList.toggle('all',view==='all');const widths=view==='all'?['64px','186px','300px','340px','350px','310px','474px']:['64px','186px','29%','24%',null];document.getElementById('columns').replaceChildren();document.getElementById('head').replaceChildren();document.getElementById('rows').replaceChildren();ids.forEach((id,i)=>{const col=document.createElement('col');if(widths[i])col.style.width=widths[i];document.getElementById('columns').append(col);const th=document.createElement('th');th.scope='col';th.className=id<2?classes[id]:'';th.textContent=headers[id];document.getElementById('head').append(th)});clean.forEach(r=>{const tr=document.createElement('tr');ids.forEach(id=>{const td=document.createElement('td');td.className=classes[id];if(id===4){td.lang='ar';td.dir='rtl'}if(id===3)td.lang='en';if(id===0){const n=document.createElement('span');n.textContent=r[id];td.append(n)}else if(id===6&&r[id].includes('；画面呈现：')){const parts=r[id].split('；画面呈现：');const first=document.createElement('strong');first.className='stack-line';first.textContent=parts[0];const second=document.createElement('span');second.className='stack-line';second.textContent='画面呈现：'+parts[1];td.append(first,second)}else td.textContent=r[id];if(id===6)td.prepend(materialPick(r[0]));tr.append(td)});document.getElementById('rows').append(tr)});document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.getElementById('view-hint').textContent=({zh:'中文口播与剪辑建议并排审阅',en:'英文字幕与剪辑建议并排审阅',ar:'阿拉伯语字幕独立右对齐',all:'完整七列 · 横向滚动查看 · 镜号与时间码固定'})[view];document.querySelector('.table-wrap').scrollLeft=0}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.view)));render('zh');
</script></body></html>
